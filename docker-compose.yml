services:
  db:
    image: postgres:16-alpine
    container_name: nexa-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexa-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro da rede do Compose o banco responde pelo nome do serviço.
      POSTGRES_HOST: db
    volumes:
      # Código montado a partir do host: o autoreload do runserver e a suíte de
      # testes passam a refletir o working tree sem exigir um novo build.
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
