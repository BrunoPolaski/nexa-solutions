<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa Solutions — Chamados</title>
  <style>
    body {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    h1, h2 {
      color: #1d4ed8;
    }

    form, article {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    label, input, textarea, select, button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      margin-bottom: 14px;
    }

    input, textarea, select {
      padding: 10px;
      border: 1px solid #9ca3af;
      border-radius: 4px;
    }

    button {
      width: auto;
      padding: 10px 16px;
      background: #1d4ed8;
      color: white;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }

    .erro {
      color: #b91c1c;
      font-weight: bold;
    }

    .sucesso {
      color: #166534;
      font-weight: bold;
    }

    .indicadores {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .indicador {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .indicador strong {
      display: block;
      font-size: 32px;
      color: #1d4ed8;
    }

    .filtro {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filtro label {
      margin-bottom: 0;
    }

    .filtro select {
      width: auto;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <h1>Sistema de Chamados</h1>
  <p>Interface da Nexa Solutions.</p>

  <section>
    <h2>Indicadores</h2>
    <div class="indicadores" id="indicadores">
      <div class="indicador"><strong id="ind-total">–</strong>Total</div>
      <div class="indicador"><strong id="ind-abertos">–</strong>Abertos</div>
      <div class="indicador"><strong id="ind-em-andamento">–</strong>Em andamento</div>
      <div class="indicador"><strong id="ind-concluidos">–</strong>Concluídos</div>
    </div>
  </section>

  <section>
    <h2>Abrir chamado</h2>

    <form id="form-chamado">
      <label for="titulo">Título *</label>
      <input id="titulo" name="titulo" type="text" required>

      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao"></textarea>

      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="ABERTO">Aberto</option>
        <option value="EM_ANDAMENTO">Em andamento</option>
        <option value="CONCLUIDO">Concluído</option>
      </select>

      <button type="submit">Cadastrar chamado</button>
    </form>

    <p id="mensagem"></p>
  </section>

  <section>
    <h2>Chamados cadastrados</h2>

    <div class="filtro">
      <div>
        <label for="filtro-status">Filtrar por status</label>
        <select id="filtro-status">
          <option value="">Todos</option>
          <option value="ABERTO">Aberto</option>
          <option value="EM_ANDAMENTO">Em andamento</option>
          <option value="CONCLUIDO">Concluído</option>
        </select>
      </div>
      <button id="atualizar" type="button">Atualizar lista</button>
    </div>

    <div id="lista-chamados"></div>
  </section>

  <script>
    // Caminhos relativos: o Django serve esta página e a API na mesma origem,
    // então não há dependência de host fixo nem necessidade de CORS.
    const API_CHAMADOS = "/api/chamados/";
    const API_INDICADORES = "/api/indicadores/";

    const escapar = (texto) => String(texto).replace(/[&<>"']/g, (caractere) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[caractere]);

    async function carregarIndicadores() {
      try {
        const resposta = await fetch(API_INDICADORES);
        const dados = await resposta.json();

        document.getElementById("ind-total").textContent = dados.total;
        document.getElementById("ind-abertos").textContent = dados.abertos;
        document.getElementById("ind-em-andamento").textContent = dados.em_andamento;
        document.getElementById("ind-concluidos").textContent = dados.concluidos;
      } catch (erro) {
        document.querySelectorAll(".indicador strong")
          .forEach((elemento) => { elemento.textContent = "–"; });
      }
    }

    async function listarChamados() {
      const lista = document.getElementById("lista-chamados");
      const status = document.getElementById("filtro-status").value;
      const url = status ? `${API_CHAMADOS}?status=${encodeURIComponent(status)}` : API_CHAMADOS;

      lista.innerHTML = "<p>Carregando...</p>";

      try {
        const resposta = await fetch(url);
        const chamados = await resposta.json();

        if (!resposta.ok) {
          lista.innerHTML = "<p class='erro'>Não foi possível consultar a API.</p>";
          return;
        }

        if (chamados.length === 0) {
          lista.innerHTML = "<p>Nenhum chamado encontrado para este filtro.</p>";
          return;
        }

        lista.innerHTML = chamados.map((chamado) => `
          <article>
            <strong>#${chamado.id} — ${escapar(chamado.titulo)}</strong>
            <p>${escapar(chamado.descricao || "Sem descrição")}</p>
            <p>Status: ${escapar(chamado.status)}</p>
          </article>
        `).join("");
      } catch (erro) {
        lista.innerHTML = "<p class='erro'>Não foi possível consultar a API.</p>";
      }
    }

    async function atualizarTela() {
      await Promise.all([carregarIndicadores(), listarChamados()]);
    }

    document.getElementById("form-chamado").addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const mensagem = document.getElementById("mensagem");
      const dados = {
        titulo: document.getElementById("titulo").value,
        descricao: document.getElementById("descricao").value,
        status: document.getElementById("status").value
      };

      try {
        const resposta = await fetch(API_CHAMADOS, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dados)
        });

        const corpo = await resposta.json();

        if (!resposta.ok) {
          // Mostra a mensagem de validação devolvida pela API
          // (ex.: "O título é obrigatório.") em vez de um erro genérico.
          mensagem.className = "erro";
          mensagem.textContent = Object.entries(corpo)
            .map(([campo, erros]) => `${campo}: ${[].concat(erros).join(" ")}`)
            .join(" | ");
          return;
        }

        mensagem.className = "sucesso";
        mensagem.textContent = "Chamado cadastrado com sucesso.";
        document.getElementById("form-chamado").reset();
        atualizarTela();
      } catch (erro) {
        mensagem.className = "erro";
        mensagem.textContent = "A API não está disponível.";
      }
    });

    document.getElementById("atualizar").addEventListener("click", atualizarTela);
    document.getElementById("filtro-status").addEventListener("change", listarChamados);

    atualizarTela();
  </script>
</body>
</html>
